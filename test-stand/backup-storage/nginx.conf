server {
    listen 80;
    server_name _;

    # Liveness probe used by the container healthcheck
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Read-only listing and download of backup files
    location /backups/ {
        alias /srv/backups/;
        autoindex on;
        autoindex_format json;
        limit_except GET HEAD { deny all; }
    }

    location / {
        return 404;
    }
}
