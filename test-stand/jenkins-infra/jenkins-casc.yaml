jenkins:
  systemMessage: "MyApp Backup System — Jenkins configured via JCasC"
  numExecutors: 2
  mode: NORMAL

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          name: "Administrator"
          password: "${JENKINS_ADMIN_PASSWORD}"
        - id: "operator"
          name: "Operator"
          password: "${JENKINS_OPERATOR_PASSWORD}"

  authorizationStrategy:
    globalMatrix:
      entries:
        - user:
            name: "admin"
            permissions:
              - "Overall/Administer"
        - user:
            name: "operator"
            permissions:
              - "Overall/Read"
              - "View/Read"
              - "Job/Read"
              - "Job/Build"
              - "Job/Cancel"

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "mongo-backup-credentials"
              description: "MongoDB user for backup jobs"
              username: "${MONGO_ROOT_USERNAME:-root}"
              password: "${MONGO_ROOT_PASSWORD}"

security:
  scriptApproval:
    # Calls used by the Active Choices scripts in .jenkins/Jenkinsfile.backup
    # to list backups in BACKUP_DIR
    approvedSignatures:
      - "new java.io.File java.io.File java.lang.String"
      - "new java.io.File java.lang.String"
      - "method java.io.File exists"
      - "method java.io.File getName"
      - "method java.io.File getPath"
      - "method java.io.File isDirectory"
      - "method java.io.File isFile"
      - "method java.io.File lastModified"
      - "method java.io.File length"
      - "method java.io.File listFiles"
      - "staticMethod org.codehaus.groovy.runtime.DefaultGroovyMethods getText java.io.File"

unclassified:
  # Audit log: backup downloads (/userContent/backups/) and the plugin's default actions
  audit-trail:
    logBuildCause: true
    pattern: ".*/(?:configSubmit|doDelete|postBuildResult|enable|disable|cancelQueue|stop|toggleLogKeep|doWipeOutWorkspace|createItem|createView|toggleOffline|cancelQuietDown|quietDown|restart|exit|safeExit)/?.*|/userContent/backups/.*"
    loggers:
      - logFile:
          log: "/var/jenkins_home/audit/audit.log"
          limit: 10
          count: 5
  location:
    url: "${JENKINS_URL:-http://localhost:8080/}"

jobs:
  # Job DSL scripts copied into the image (see Dockerfile)
  - file: /var/jenkins_casc/jobs/myapp-backup.groovy
