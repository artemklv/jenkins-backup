# Staging environment: Jenkins + MongoDB 3.6 + backup storage node.
# Backups live in ./mock-storage, the shared disk of Jenkins and backup-storage.

services:
  jenkins-server:
    build:
      context: ./jenkins-infra/
    image: myapp-jenkins:latest
    container_name: jenkins-server
    ports:
      - "8080:8080"     # Web UI
      - "50000:50000"   # Inbound agent (JNLP) port
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}
      JENKINS_OPERATOR_PASSWORD: ${JENKINS_OPERATOR_PASSWORD}
      BACKUP_REPO_URL: ${BACKUP_REPO_URL}
      BACKUP_REPO_BRANCH: ${BACKUP_REPO_BRANCH:-main}
      JENKINS_URL: ${JENKINS_URL:-http://localhost:8080/}
    volumes:
      - jenkins_data:/var/jenkins_home
      - ./mock-storage:/var/backups/mongodb   # Shared backup disk
    depends_on:
      backup-storage:
        condition: service_healthy
    networks:
      - jenkins-backup-network
    restart: unless-stopped

  mongodb-test:
    image: mongo:3.6
    container_name: mongodb-test
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
    volumes:
      - mongo_test_data:/data/db
      - ./init-db:/docker-entrypoint-initdb.d:ro   # Seed scripts (*.js), first start only
    healthcheck:
      # The legacy 'mongo' shell ships with 3.6; 'ping' does not require auth
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - jenkins-backup-network
    restart: unless-stopped

  backup-storage:
    build:
      context: ./backup-storage/
    image: myapp-backup-storage:latest
    container_name: backup-storage
    volumes:
      - ./mock-storage:/srv/backups:ro   # Shared backup disk (written by Jenkins)
    networks:
      - jenkins-backup-network
    restart: unless-stopped

networks:
  jenkins-backup-network:
    name: jenkins-backup-network
    driver: bridge

volumes:
  jenkins_data:
  mongo_test_data:
