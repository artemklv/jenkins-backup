# Staging environment: Jenkins + MongoDB 3.6 + backup storage node.
# Backups live on the storage node's disk (volume backup_disk), exported over NFS;
# Jenkins mounts the export as the volume backup_nfs.

services:
  jenkins-server:
    build:
      context: ./jenkins-infra/
    image: myapp-jenkins:latest
    container_name: jenkins-server
    ports:
      - "8080:8080"     # Web UI
      - "50000:50000"   # Inbound agent (JNLP) port
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}
      JENKINS_OPERATOR_PASSWORD: ${JENKINS_OPERATOR_PASSWORD}
      BACKUP_REPO_URL: ${BACKUP_REPO_URL}
      BACKUP_REPO_BRANCH: ${BACKUP_REPO_BRANCH:-main}
      JENKINS_URL: ${JENKINS_URL:-http://localhost:8080/}
      # MongoDB credential for backup jobs (JCasC: mongo-backup-credentials)
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - jenkins_data:/var/jenkins_home
      # Backup disk over NFS: jobs write backups here
      - type: volume
        source: backup_nfs
        target: /var/backups/mongodb
        volume:
          # Do not copy image content into the volume: that would mount NFS
          # at container creation, before the storage node is up
          nocopy: true
      # Same disk, read-only, served by Jenkins at /userContent/backups/ (download links)
      - type: volume
        source: backup_nfs
        target: /var/jenkins_home/userContent/backups
        read_only: true
        volume:
          nocopy: true
    healthcheck:
      # Ready when the web UI answers (JCasC and jobs are applied before that)
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:8080/login"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      backup-storage:
        condition: service_healthy
    networks:
      - jenkins-backup-network
    restart: unless-stopped

  mongodb-test:
    image: mongo:3.6
    container_name: mongodb-test
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
    volumes:
      - mongo_test_data:/data/db
      - ./init-db:/docker-entrypoint-initdb.d:ro   # Seed scripts (*.js), first start only
    healthcheck:
      # The legacy 'mongo' shell ships with 3.6; 'ping' does not require auth
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - jenkins-backup-network
    restart: unless-stopped

  backup-storage:
    build:
      context: ./backup-storage/
    image: myapp-backup-storage:latest
    container_name: backup-storage
    # The kernel NFS server needs a privileged container
    privileged: true
    environment:
      NFS_CLIENTS: ${BACKUP_NETWORK_SUBNET:-172.28.10.0/24}
    volumes:
      - backup_disk:/exports   # The backup disk itself
    networks:
      jenkins-backup-network:
        # Fixed address: the Docker daemon mounts backup_nfs by IP, not by container name
        ipv4_address: ${BACKUP_STORAGE_IP:-172.28.10.10}
    restart: unless-stopped

networks:
  jenkins-backup-network:
    name: jenkins-backup-network
    driver: bridge
    ipam:
      config:
        - subnet: ${BACKUP_NETWORK_SUBNET:-172.28.10.0/24}

volumes:
  jenkins_data:
  mongo_test_data:
  # Backup disk on the storage node
  backup_disk:
  # NFS export of backup_disk, mounted into Jenkins.
  # soft: if the storage node is unreachable, file operations fail with an error
  # (the build fails) instead of hanging forever.
  backup_nfs:
    driver_opts:
      type: nfs
      o: "addr=${BACKUP_STORAGE_IP:-172.28.10.10},nfsvers=4.1,rw,soft,timeo=600,retrans=2"
      device: ":/"
